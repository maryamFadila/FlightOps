apiVersion: batch/v1
kind: CronJob
metadata:
  name: flightops-db-cleanup
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: db-cleaner
              image: mysql:8.0
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: flightops-secret
                      key: DB_PASSWORD
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: flightops-config
                      key: DB_HOST
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: flightops-config
                      key: DB_NAME
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting cleanup of flight records older than 7 days from flight_weather..."
                  mysql -h "$DB_HOST" -u root "$DB_NAME" -e "DELETE FROM flight_weather WHERE inserted_at < NOW() - INTERVAL 7 DAY;"
                  echo "Cleanup finished successfully!"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
          restartPolicy: OnFailure
